<!-- Шапка с горизонтальным меню -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <!-- Логотип -->
        <a href="{% url 'mailing:home' %}" class="navbar-brand d-flex align-items-center">
            <i class="bi bi-envelope-check me-2"></i>
            <strong>Система рассылок</strong>
        </a>

        <!-- Тогглер для мобильной версии -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Переключить навигацию">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Навигация -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <!-- Главная -->
                <li class="nav-item">
                    <a href="{% url 'mailing:home' %}" class="nav-link">
                        <i class="bi bi-house me-1"></i>Главная
                    </a>
                </li>

                {% if user.is_authenticated %}
                <!-- Получатели -->
                <li class="nav-item">
                    <a href="{% url 'mailing:recipient_list' %}" class="nav-link">
                        <i class="bi bi-people me-1"></i>Получатели
                    </a>
                </li>

                <!-- Сообщения -->
                <li class="nav-item">
                    <a href="{% url 'mailing:message_list' %}" class="nav-link">
                        <i class="bi bi-chat-text me-1"></i>Сообщения
                    </a>
                </li>

                <!-- Рассылки -->
                <li class="nav-item">
                    <a href="{% url 'mailing:mailing_list' %}" class="nav-link">
                        <i class="bi bi-send me-1"></i>Рассылки
                    </a>
                </li>

                <!-- Статистика -->
                <li class="nav-item">
                    <a href="{% url 'mailing:user_stats' %}" class="nav-link">
                        <i class="bi bi-bar-chart me-1"></i>Статистика
                    </a>
                </li>

                <!-- Выпадающее меню пользователя -->
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                       data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle me-1"></i>{{ user.email }}
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" href="{% url 'users:profile' %}">
                            <i class="bi bi-person me-2"></i>Профиль
                        </a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form method="post" action="{% url 'users:logout' %}" class="d-inline">
                                {% csrf_token %}
                                <button type="submit" class="dropdown-item">
                                    <i class="bi bi-box-arrow-right me-2"></i>Выйти
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
                {% else %}
                <!-- Для неавторизованных -->
                <li class="nav-item">
                    <a href="{% url 'users:login' %}" class="nav-link">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Войти
                    </a>
                </li>
                <li class="nav-item">
                    <a href="{% url 'users:register' %}" class="nav-link">
                        <i class="bi bi-person-plus me-1"></i>Регистрация
                    </a>
                </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>
