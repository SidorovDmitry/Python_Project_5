{% extends 'mailing/base.html' %}

{% block title %}Подтверждение почты{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow text-center">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0"><i class="bi bi-check-circle"></i> Почта подтверждена</h4>
                </div>
                <div class="card-body">
                    <div class="mb-4">
                        <i class="bi bi-envelope-check" style="font-size: 3rem; color: #198754;"></i>
                    </div>

                    <h5>Почта успешно подтверждена!</h5>
                    <p class="text-muted">
                        Теперь вы можете войти в систему.
                    </p>

                    <div class="mt-4">
                        <a href="{% url 'users:login' %}" class="btn btn-primary">
                            <i class="bi bi-box-arrow-in-right"></i> Войти в систему
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
