{% extends 'mailing/base.html' %}

{% block title %}Выход из системы{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow text-center">
                <div class="card-header bg-warning text-dark">
                    <h4 class="mb-0"><i class="bi bi-box-arrow-right"></i> Выход из системы</h4>
                </div>
                <div class="card-body">
                    <div class="mb-4">
                        <i class="bi bi-question-circle" style="font-size: 3rem; color: #ffc107;"></i>
                    </div>

                    <h5>Вы уверены, что хотите выйти?</h5>

                    <form method="post" action="{% url 'users:logout' %}" class="mt-4">
                        {% csrf_token %}
                        <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                            <button type="submit" class="btn btn-danger me-md-2">
                                <i class="bi bi-box-arrow-right"></i> Выйти
                            </button>
                            <a href="{% url 'mailing:home' %}" class="btn btn-secondary">
                                <i class="bi bi-x-lg"></i> Отмена
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
